[package]
name = "ai-mission-manager"
version = "0.1.0"
description = "A personal control plane for work delegated to people and agents"
authors = ["Piero"]
edition = "2021"

[lib]
name = "ai_mission_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

[dev-dependencies]
specta-typescript = "=0.0.12"
tempfile = "3"
