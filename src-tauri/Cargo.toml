[package]
name = "ai-mission-manager"
version = "0.1.0"
description = "A personal control plane for work delegated to people and agents"
authors = ["Piero"]
edition = "2021"

[lib]
name = "ai_mission_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
